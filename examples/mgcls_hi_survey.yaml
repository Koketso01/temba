# =====================================================================
#  TEMBA survey parameter file for MGCLS-HI (DR1 fields + Chapter 4 clusters)
#
#  On jake this list was built from the existing field.yaml files with
#      temba import fields --out mgcls_hi.yaml --workdir .
#  and the two Chapter 4 clusters were added by hand at the end. Existing
#  fields/<name>/field.yaml files are kept as they are (temba never
#  overwrites them without --overwrite), so hand-tuned settings such as
#  Abell-4038's fixed reliability kernel and J0314's channel cut stay in force.
# =====================================================================
survey: MGCLS-HI
workdir: .
tools:
  sofia: /home/mophahlane/SoFiA-2/sofia
  bbarolo: /net/sinatra/vault-janis/mophahlane/HI_MGCLS_tempfolder/Finished_Completeness/Bbarolo-1.7/BBarolo
  ld_library_path: /home/mophahlane/anaconda3/envs/sofia2/lib
  pythonpath: /net/sinatra/vault-janis/mophahlane/HI_MGCLS_tempfolder/Finished_Completeness/Bbarolo-1.7
cosmology:
  H0: 70.0
  Om0: 0.3
injection:
  sources_per_mvox: 0.806
  min_sources: 50
  max_sources: 1200
  realisations: 4
  field_dependent_seeds: false
  design:
    log_snr:
    - -0.5
    - 2.0
    w50_kms:
    - 40.0
    - 600.0
    d_over_beam:
    - 0.25
    - 4.0
    inclination_deg:
    - 15.0
    - 85.0
    sigma_hi_msun_pc2:
    - 1.2
    - 30.0
run:
  null_run: false
  cleanup: true
  parallel: 2
analysis:
  bootstrap: 200
  journal: mnras
  fonts: auto
  min_freq_mhz:
    J0314.3-4525: 1309
    J0351.1-8212: 1307
    J0431.4-6126: 1305
fields:
- name: Abell-168
  cube: /net/sinatra/vault-janis/mophahlane/HI_MGCLS_tempfolder/Cluster-Cubes/Abell-168.fits
  mask: /net/sinatra/vault-janis/mophahlane/HI_MGCLS_tempfolder/Cluster-Masks/Abell-168_mask.fits
  sofia_par: /net/sinatra/vault-janis/mophahlane/HI_MGCLS_tempfolder/noise_cubes/Abell-168_sofia.par
  catalogue: /net/sinatra/vault-janis/mophahlane/HI_MGCLS_tempfolder/noise_cubes/Abell-168_cat.xml
  noise_cube: /net/sinatra/vault-janis/mophahlane/HI_MGCLS_tempfolder/noise_cubes/Abell-168_noise.fits
  z: 0.05
- name: Abell-194
